[project]
name = "micropython-networkutils"
description = "Micropython network interface utility package."
authors = [{name = "Andrew Ridyard", email = "andyrids.uncapped698@passmail.net"}]
maintainers = [{name = "Andrew Ridyard", email = "andyrids.uncapped698@passmail.net"}]
dynamic = ["version"]
license = {file = "LICENSE.md"}
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
classifiers=[
    # 3 - Alpha | 4 - Beta | 5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    # Python versions
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Embedded Systems",
]
keywords = ["micropython", "package", "microcontroller", "network"]
dependencies = []

[dependency-groups]
dev = [
    "hatch>=1.14.1",
    "micropython-rp2-rpi-pico-w-stubs~=1.28",
    "micropython-stdlib-stubs~=1.28",
    "mpremote~=1.28",
    "mpy-cross>=1.27.0.post2,<1.29",
    "mypy>=1.20.2",
    "prek>=0.3.11",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
    "ruff>=0.11.5",
    "types-pyserial>=3.5.0.20260408",
]

[project.urls]
Repository = "https://gitlab.com/micropython-iot-projects/libraries/micropython-networkutils"
Issues = "https://gitlab.com/micropython-iot-projects/libraries/micropython-networkutils/-/issues"

[tool.ruff]
exclude = ["lib", "env"]
indent-width = 4
line-length = 79

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint]
select = [
    "ANN001", # flake8-annotations (missing-type-function-argument)
    "ANN002", # flake8-annotations (missing-type-args)
    "ANN003", # flake8-annotations (missing-type-kwargs)
    "D1",     # pydocstyle (undocumented-* ruleset)
    "D403",   # pydocstyle (first-word-uncapitalized)
    "D417",   # pydocstyle (undocumented-param)
    "D419",   # pydocstyle (empty-docstring)
    "E",      # pycodestyle (error ruleset)
    "ERA",    # commented out code
    "F401",   # pyflakes (unused-import)
    "I002",   # isort (missing-required-import)
    "LOG002", # flake8-logging (invalid-get-logger-argument)
    "LOG007", # flake8-logging (exception-without-exc-info)
    "LOG015", # flake8-logging (root-logger-call)
    "NPY001", # NumPy-specific rules (numpy-deprecated-type-alias)
    "NPY003", # NumPy-specific rules (numpy-deprecated-function)
    "T100",   # flake8-debugger (debugger)
    "T201",   # flake8-print (print)
    "TRY002", # tryceratops (raise-vanilla-class)
    "TRY003", # tryceratops (raise-vanilla-args)
    "TRY004", # tryceratops (type-check-without-type-error)
    "TRY300", # tryceratops (try-consider-else)
    "TRY401", # tryceratops (verbose-log-message)
    "W",      # pycodestyle (warning ruleset)
    "C90",    # McCabe complexity (complex-structure)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/{test_}*" = ["D102"] # Missing docstring in public method

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.hooks.custom]
# custom build hook configuration
path = "scripts/build/compile.py"
# custom build hook options
only-include = ["networkutils/"]
compiler-options = ["-O2"]

# `packages` causes DIR collapse i.e. `networkutils/networkutils` -> `networkutils` and
# `only-include` set to `networkutils` in the extension packages' `pyproject.toml`
[tool.hatch.build.targets.sdist]
packages = ["networkutils/"]

[tool.hatch.build.targets.wheel]
packages = ["networkutils/"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"

[tool.mypy]
strict = true
pretty = true
# mypy_path = ".venv/Lib/site-packages"
# custom_typeshed_dir = ".venv/lib/site-packages" # allow mypy to use micropython-stdlib
# files = "src/*.py"
follow_imports = "silent"
mypy_path = ["typings"]

[[tool.mypy.overrides]]
module = ["mpremote", "mpremote.*"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["tests.integration.*"]
disable_error_code = ["import-untyped"]